name: Render video
run-name: Render ${{ inputs.request_id || inputs.script_path }}
on:
  workflow_dispatch:
    inputs:
      script_path:
        description: Markdown script already committed under scripts/
        type: string
        default: scripts/hello-studio.md
        required: true
      voice:
        description: Narration voice
        type: choice
        options: [af_heart, am_adam, bf_emma, bm_george]
        default: af_heart
      publish:
        description: Replace the public GitHub Pages video with this result
        type: boolean
        default: false
      request_id:
        description: Optional unique label for an assistant to identify its run
        type: string
        default: ''
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate request
        id: request
        env:
          STUDIO_SCRIPT: ${{ inputs.script_path }}
          STUDIO_VOICE: ${{ inputs.voice }}
        run: python tooling/cloud.py prepare
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: |
            kokoro-v1.0.int8.onnx
            voices-v1.0.bin
          key: kokoro-model-files-v1.0-int8
      - run: npm run setup
      - run: npm test
      - name: Generate and verify video
        env:
          STUDIO_SCRIPT: ${{ inputs.script_path }}
          STUDIO_VOICE: ${{ inputs.voice }}
        run: node tooling/run-python.cjs tooling/cloud.py render
      - name: Save MP4 and editable composition
        uses: actions/upload-artifact@v4
        with:
          name: video-${{ steps.request.outputs.slug }}-${{ github.run_id }}
          path: |
            output/${{ steps.request.outputs.slug }}.mp4
            compositions/${{ steps.request.outputs.slug }}/
          if-no-files-found: error
          retention-days: 7
      - name: Build playback page
        if: inputs.publish && github.ref == 'refs/heads/main'
        env:
          STUDIO_SCRIPT: ${{ inputs.script_path }}
          STUDIO_VOICE: ${{ inputs.voice }}
        run: node tooling/run-python.cjs tooling/cloud.py page
      - uses: actions/configure-pages@v5
        if: inputs.publish && github.ref == 'refs/heads/main'
      - uses: actions/upload-pages-artifact@v4
        if: inputs.publish && github.ref == 'refs/heads/main'
        with:
          path: .site
  publish:
    if: inputs.publish && github.ref == 'refs/heads/main'
    needs: render
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: video-studio-pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish playback page
        id: deployment
        uses: actions/deploy-pages@v4
